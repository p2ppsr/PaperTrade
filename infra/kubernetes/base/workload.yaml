apiVersion: apps/v1
kind: Deployment
metadata:
  name: papertrade
  labels:
    app.kubernetes.io/name: papertrade
    app.kubernetes.io/component: api
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: papertrade
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: papertrade
        app.kubernetes.io/component: api
        storage.papertrade.metanet.app/backend: s3
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: papertrade
                  app.kubernetes.io/component: api
      containers:
        - name: papertrade
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: papertrade:local
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["node", "-e", "setTimeout(() => {}, 10000)"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: papertrade-config
            - secretRef:
                name: papertrade-secrets
          env:
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: papertrade-s3-credentials
                  key: access-key
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: papertrade-s3-credentials
                  key: secret-key
          volumeMounts:
            - name: papertrade-data
              mountPath: /data/papertrade
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
      volumes:
        - name: papertrade-data
          emptyDir:
            sizeLimit: 10Gi
