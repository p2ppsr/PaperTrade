name: Deploy Production Local Kubernetes

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to deploy. Defaults to the selected ref.
        required: false
        type: string
      build_runtime_base:
        description: Rebuild the heavy document-conversion runtime base image first.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: papertrade-production-local
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux-amd64
      - docker
      - kubectl
      - local-registry
    environment: production
    env:
      REGISTRY_PUSH: ${{ vars.LOCAL_REGISTRY_PUSH || 'registry.cars-operator-system.svc.cluster.local:5000' }}
      REGISTRY_PULL: ${{ vars.LOCAL_REGISTRY_PULL || 'registry.cars-operator-system.svc.cluster.local:5000' }}
      KUBECTL: ${{ vars.LOCAL_KUBECTL || 'kubectl' }}
      SQL_DATABASE_USER: ${{ secrets.PROD_SQL_DATABASE_USER }}
      SQL_DATABASE_PASSWORD: ${{ secrets.PROD_SQL_DATABASE_PASSWORD }}
      SERVER_PRIVATE_KEY: ${{ secrets.PROD_SERVER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Select deploy commit
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.source_sha }}" ]]; then
            git checkout --detach "${{ github.event.inputs.source_sha }}"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Deploy preflight
        run: |
          set -euo pipefail
          "${KUBECTL}" version --client
          "${KUBECTL}" get nodes -o wide
          "${KUBECTL}" -n papertrade-prod get deployment/papertrade >/dev/null 2>&1 || true
      - name: Build and publish PaperTrade image
        id: build
        run: |
          set -euo pipefail
          build_target=app
          if [[ "${{ github.event.inputs.build_runtime_base }}" == "true" ]]; then
            build_target=all
          fi
          BUILD_TARGET="${build_target}" scripts/k8s/build-local-image.sh
      - name: Scan the exact production digest
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          exact_image="${REGISTRY_PUSH}/p2ppsr/papertrade@${CANDIDATE_DIGEST}"
          docker pull "$exact_image"
          archive="$(mktemp)"
          scanner=""
          cleanup() {
            rm -f "$archive"
            if [[ -n "$scanner" ]]; then docker rm -f "$scanner" >/dev/null; fi
          }
          trap cleanup EXIT
          docker save --output "$archive" "$exact_image"
          # The remote daemon cannot bind-mount this runner Pod's workspace.
          # Copy an exact-image archive instead of exposing the Docker socket or credentials.
          scanner="$(docker create \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --input /tmp/papertrade.tar --scanners vuln --format json \
            --output /tmp/trivy-production-image.json)"
          docker cp "$archive" "$scanner:/tmp/papertrade.tar"
          docker start --attach "$scanner"
          docker cp "$scanner:/tmp/trivy-production-image.json" trivy-production-image.json
          .github/scripts/enforce-image-security.sh trivy-production-image.json
      - name: Deploy production to local Kubernetes
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ steps.build.outputs.image_tag }}" \
          IMAGE_DIGEST="${{ steps.build.outputs.image_digest }}" scripts/k8s/deploy-local.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papertrade-release-manifest-${{ steps.build.outputs.image_tag }}
          path: |
            release-manifest.json
            rollout-evidence.jsonl
            trivy-production-image.json
      - name: Deployment summary
        run: |
          {
            echo "### PaperTrade production deployment"
            echo ""
            echo "- Commit: \`${SOURCE_SHA}\`"
            echo "- Image tag: \`${{ steps.build.outputs.image_tag }}\`"
            echo "- Image: \`${{ steps.build.outputs.image }}\`"
            echo "- Digest: \`${{ steps.build.outputs.image_digest }}\`"
            echo "- Runtime base: \`${{ steps.build.outputs.runtime_base_image }}\`"
            echo "- Namespace: \`papertrade-prod\`"
          } >> "$GITHUB_STEP_SUMMARY"
