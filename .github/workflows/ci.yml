name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CWI_NPM_TOKEN: ${{ secrets.CWI_NPM_TOKEN }}
      - run: python3 -m unittest discover -s scripts/k8s/tests -v
      - run: bash -n scripts/k8s/deploy-local.sh
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
